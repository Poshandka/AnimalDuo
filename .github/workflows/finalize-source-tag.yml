name: Finalize reviewed source tag
on:
  push:
    paths:
      - .github/workflows/finalize-source-tag.yml
permissions:
  contents: write
jobs:
  tag:
    if: github.repository == 'ShawndYang/AnimalDuo'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Point the publication tag at the verified complete source
        run: gh api --method PATCH repos/ShawndYang/AnimalDuo/git/refs/tags/source-20261031 -f sha=fbab29fd77cfe57710a691b7ac16e219846f938d -F force=false
