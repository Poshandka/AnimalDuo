name: Import reviewed AnimalDuo source
on:
  push:
    paths:
      - .github/workflows/publish-source.yml
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'ShawndYang/AnimalDuo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Download the reviewed source archive
        run: curl --fail --location --output "$RUNNER_TEMP/animalduo-source.zip" https://github.com/ShawndYang/AnimalDuo/releases/download/source-20261031/AnimalDuo-source-20261031.zip
      - name: Verify the archive and every source file
        shell: python
        run: |
          from pathlib import Path, PurePosixPath
          import hashlib, os, stat, zipfile
          archive = Path(os.environ["RUNNER_TEMP"]) / "animalduo-source.zip"
          expected = "a83d9f16f55978dbf62e3d1767a1a1c6d7a81c74376d7a930632108dafe008df"
          assert hashlib.file_digest(archive.open("rb"), "sha256").hexdigest() == expected
          with zipfile.ZipFile(archive) as z:
              names = z.namelist()
              assert len(names) == len(set(names)) == 2059
              assert z.testzip() is None
              for name in names:
                  parts = PurePosixPath(name).parts
                  assert parts[0] == "AnimalDuo" and len(parts) > 1
                  assert not PurePosixPath(name).is_absolute()
                  assert not {".git", "..", "validation", "__pycache__"}.intersection(parts)
                  assert not stat.S_ISLNK(z.getinfo(name).external_attr >> 16)
              manifest = z.read("AnimalDuo/SOURCE-MANIFEST.sha256").decode().splitlines()
              assert len(manifest) == 2058
              listed = set()
              for row in manifest:
                  digest, rel = row.split("  ", 1)
                  data = z.read("AnimalDuo/" + rel)
                  assert hashlib.sha256(data).hexdigest() == digest
                  listed.add("AnimalDuo/" + rel)
              assert listed | {"AnimalDuo/SOURCE-MANIFEST.sha256"} == set(names)
              for name in names:
                  target = Path(*PurePosixPath(name).parts[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(z.read(name))
                  target.chmod((z.getinfo(name).external_attr >> 16) & 0o777 or 0o644)
          print("Verified and imported 2059 source files.")
      - name: Publish the source with a service identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':(exclude).github/workflows/**'
          git commit -m "Publish privacy-reviewed AnimalDuo source"
          git push origin HEAD:main
