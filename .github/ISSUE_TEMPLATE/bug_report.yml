name: 问题反馈 / Bug report
description: 提交可以复现的问题，不要上传存档、密钥或个人资料。
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        请填写版本与复现步骤。日志请先去除个人路径、设备标识和云目录信息；不要上传完整存档、密钥、签名资料或游戏资源。
  - type: input
    id: version
    attributes:
      label: 项目版本与应用构建 / Version and build
      placeholder: AnimalDuo 1.1 / 3.0.59
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: 设备型号与系统版本 / Device and OS
      placeholder: 只填写型号与系统版本，不填写序列号或设备标识。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤 / Reproduction steps
      placeholder: 按顺序描述操作，以及是否每次发生。
    validations:
      required: true
  - type: textarea
    id: expected_actual
    attributes:
      label: 预期与实际结果 / Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 相关设置 / Relevant settings
      description: 按需说明横竖屏、内外屏、手柄连接方式，以及是否涉及联机或云存档。
  - type: textarea
    id: diagnostics
    attributes:
      label: 脱敏日志或补充信息 / Redacted diagnostics
      description: 可留空。不要提交密钥、签名资料、完整存档、云快照或原始个人设备资料。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查 / Privacy check
      options:
        - label: 我已检查公开内容，不包含个人设备标识、私人路径、密钥、签名资料、完整存档或游戏资源。
          required: true
